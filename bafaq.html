<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বেফাকুল মাদারিসিল আরাবিয়া - প্রশ্ন ব্যাংক</title>
    <style>
        /* ===== Base Style ===== */
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            direction: rtl; 
        }

        /* ===== Floating Smoke ===== */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: url("https://i.imgur.com/8IuucQZ.png");
            opacity: 0.15;
            animation: smoke 60s linear infinite;
            z-index: -1; 
        }

        @keyframes smoke {
            from { transform: translateX(0) translateY(0); }
            to   { transform: translateX(-500px) translateY(-300px); }
        }

        /* ===== Main Box ===== */
        .container {
            position: relative;
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 650px;
            width: 92%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* ফিরে যান বাটন */
        .back-btn {
            text-decoration: none;
            color: #fcc201;
            border: 1px solid #fcc201;
            padding: 6px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 25px;
            font-size: 14px;
            transition: 0.3s;
        }
        .back-btn:hover { background: #fcc201; color: #000; }

        /* ===== শিরোনাম ডিজাইন ===== */
        .header { margin-bottom: 30px; }
        h1 {
            font-size: 30px; margin: 0; font-weight: 800;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .subtitle-ar { font-size: 24px; margin-top: 8px; color: #fcf6ba; opacity: 0.9; }

        /* ===== Buttons Container ===== */
        .buttons-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            max-width: 420px;
            margin: auto;
        }

        /* ===== Buttons & Tooltip Style ===== */
        .btn {
            padding: 14px;
            font-size: 17px;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
            position: relative;
            display: block;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
        }

        /* টুলটিপ মেসেজ ডিজাইন */
        .btn[data-info]::after {
            content: attr(data-info);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fcc201;
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 13px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 100;
            border: 1px solid #fcc201;
        }
        .btn[data-info]:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* রঙের ভিন্নতা */
        .btn:nth-child(1) { background: linear-gradient(45deg, #00c6ff, #0072ff); } /* দাওরা */
        .btn:nth-child(2) { background: linear-gradient(45deg, #ff512f, #dd2476); } /* মেশকাত */
        .btn:nth-child(3) { background: linear-gradient(45deg, #36d1dc, #5b86e5); } /* শরহে বেকায়া */
        .btn:nth-child(4) { background: linear-gradient(45deg, #11998e, #38ef7d); } /* কাফিয়া */
        .btn:nth-child(5) { background: linear-gradient(45deg, #f7971e, #ffd200); } /* নাহবেমীর */
        .btn:nth-child(6) { background: linear-gradient(45deg, #8e44ad, #c33764); } /* তাইসীর */

        /* বেলুন ইফেক্ট */
        .balloon {
            position: absolute; bottom: -150px; width: 60px; height: 80px;
            border-radius: 50%; opacity: 0.3; animation: float 20s linear infinite; z-index: -1;
        }
        @keyframes float { from { transform: translateY(0); } to { transform: translateY(-120vh); } }

        @media (max-width: 480px) {
            h1 { font-size: 22px; }
            .subtitle-ar { font-size: 18px; }
            .btn { font-size: 15px; padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="balloon" style="left:5%; background:red; animation-delay:0s;"></div>
    <div class="balloon" style="left:25%; background:yellow; animation-delay:5s;"></div>
    <div class="balloon" style="left:45%; background:blue; animation-delay:2s;"></div>
    <div class="balloon" style="left:65%; background:green; animation-delay:8s;"></div>
    <div class="balloon" style="left:85%; background:pink; animation-delay:4s;"></div>

        <div class="header">
            <h1>বেফাকুল মাদারিসিল আরাবিয়া বাংলাদেশ</h1>
            <div class="subtitle-ar">وفاق المدارس العربية بنجلاديش</div>
        </div>

        <div class="buttons-container">
            <a href="1.daura.html" class="btn" data-info=" ২০১৭ সালে দাওরার পরীক্ষা হাইআতে রূপান্তরিত হয়।">০১। দাওরায়ে হাদীস</a>
            <a href="2.meskat.html" class="btn">০২। মেশকাত জামাত</a>
            <a href="3.sorhe_bekaea.html" class="btn">০৩। শরহে বেকায়া জামাত</a>
            <a href="4.kafiea.html" class="btn" data-info="২০২৫সালে ৪৮তম বেফাক পরীক্ষায় এটি ১ম বার বেফাক বোর্ড কর্তৃক পরীক্ষা নেওয়া শুরু হয়।">০৪। কাফিয়া জামাত</a>
            <a href="5.nahbemir.html" class="btn">০৫। নাহবেমীর জামাত</a>
            <a href="6.tysir.html" class="btn">০৬। তাইসীর জামাত</a>
        </div>
    </div>

</body>
</html>
